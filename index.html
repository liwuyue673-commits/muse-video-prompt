<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedance提示词面板｜AI扩写+拼装模板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{padding:16px;background:#f4f6f8;color:#222;max-width:720px;margin:0 auto}
h2{margin-bottom:16px;font-size:20px}
.block{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000010}
label{display:block;margin:8px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:11px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;margin:4px 0;cursor:pointer}
button.gray{background:#6b7280}
button.green{background:#059669}
#result{min-height:120px;background:#f8fafc}
#negResult{min-height:80px;background:#fff2f2}
.tpl-item{padding:8px;border:1px solid #eee;border-radius:8px;margin:6px 0;cursor:pointer}
.tip{color:#666;font-size:13px;margin:4px 0}
</style>
</head>
<body>
<h2>Seedance提示词面板</h2>

<div class="block">
  <label>🔑 豆包API Key（AI扩写需要）</label>
  <input id="apikey" type="password" placeholder="填入你的Doubao API Key">
  <p class="tip">不填的话，AI扩写功能失效，拼装模板依然能用</p>
</div>

<div class="block">
  <label>✍️ 简短描述（AI扩写入口）</label>
  <textarea id="shortInput" placeholder="一句话描述画面，例如：女孩在路边散步，千禧年DV录像"></textarea>
  <button class="green" onclick="aiExpand()">✨ AI自动扩写生成提示词</button>
  <p class="tip">AI会自动补充光影、运镜、质感、配套负面词</p>
</div>

<div class="block">
  <label>主体/场景描述（手动拼装）</label>
  <textarea id="main" placeholder="例：上杉绘梨衣站在树下，微风拂动长发"></textarea>
  <div class="row">
    <div>
      <label>画面风格</label>
      <select id="style">
        <option value="">无</option>
        <option>千禧DV录像，4:3，手持晃动，胶片颗粒，暖黄复古色调</option>
        <option>超写实人像，单反50mm f1.8，自然光，皮肤质感细腻</option>
        <option>日系清新，柔和漫射光，低饱和，干净背景</option>
        <option>电影夜景，冷色调，氛围感，浅景深</option>
      </select>
    </div>
    <div>
      <label>运镜</label>
      <select id="camera">
        <option value="">无</option>
        <option>缓慢向前推镜</option>
        <option>轻微呼吸感手持</option>
        <option>缓慢横移</option>
        <option>固定机位</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div>
      <label>画幅比例</label>
      <select id="ratio">
        <option value="">无</option>
        <option>9:16竖屏</option>
        <option>16:9横屏</option>
        <option>4:3复古DV</option>
      </select>
    </div>
    <div>
      <label>画质</label>
      <select id="quality">
        <option value="">无</option>
        <option>8K超写实，细节丰富，无过度美颜</option>
        <option>4K电影质感，柔和动态模糊</option>
      </select>
    </div>
  </div>
  <button onclick="build()">🧩 手动拼装提示词</button>
  <label>负面提示词（规避崩坏）</label>
  <textarea id="negative" placeholder="畸形肢体，扭曲面部，多手指，水印，文字，闪烁，变形，画面撕裂"></textarea>
</div>

<div class="block">
  <label>✅ 正向提示词</label>
  <textarea id="result" readonly></textarea>
  <div class="row">
    <button onclick="copyPos()">复制正向</button>
    <button onclick="copyNeg()">复制负面</button>
  </div>
  <label>❌ 负面提示词</label>
  <textarea id="negResult" readonly></textarea>
  <button class="gray" onclick="saveTpl()">保存整套模板</button>
</div>

<div class="block">
  <label>我的模板（点击载入）</label>
  <div id="tplList"></div>
  <button class="gray" onclick="clearTpl()">清空全部模板</button>
</div>

<script>
const mainEl = document.getElementById('main');
const styleEl = document.getElementById('style');
const cameraEl = document.getElementById('camera');
const ratioEl = document.getElementById('ratio');
const qualityEl = document.getElementById('quality');
const negEl = document.getElementById('negative');
const resEl = document.getElementById('result');
const negResEl = document.getElementById('negResult');
const shortInputEl = document.getElementById('shortInput');
const apiKeyEl = document.getElementById('apikey');
const tplKey = 'seedance-prompt-v3';

// 手动拼装
function build(){
  let pos = [];
  if(mainEl.value.trim()) pos.push(mainEl.value.trim());
  if(styleEl.value) pos.push(styleEl.value);
  if(cameraEl.value) pos.push(cameraEl.value);
  if(ratioEl.value) pos.push(ratioEl.value);
  if(qualityEl.value) pos.push(qualityEl.value);
  resEl.value = pos.join('，');
  negResEl.value = negEl.value.trim();
}

// AI扩写（豆包API）
async function aiExpand(){
  const key = apiKeyEl.value.trim();
  const text = shortInputEl.value.trim();
  if(!key) return alert('请先填入豆包API Key！');
  if(!text) return alert('请输入简短画面描述！');
  resEl.value = "AI生成中...";
  negResEl.value = "";
  try{
    const resp = await fetch("https://ark.cn-beijing.volces.com/api/v3/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${key}`
      },
      body:JSON.stringify({
        model:"doubao-lite-4k",
        messages:[
          {role:"system",content:"你是Seedance视频提示词专家。根据用户简短描述，扩充适合AI视频的正向提示词，补充光影、质感、相机参数、动态细节；另外单独输出负面提示词，防止畸形、人脸崩坏、闪烁、水印。格式严格：【正向】xxx\n【负面】xxx，不要多余解释。"},
          {role:"user",content:text}
        ]
      })
    })
    const data = await resp.json();
    const raw = data.choices[0].message.content;
    const posMatch = raw.match(/【正向】([\s\S]*?)【负面】/);
    const negMatch = raw.match(/【负面】([\s\S]*)/);
    if(posMatch && negMatch){
      resEl.value = posMatch[1].trim();
      negResEl.value = negMatch[1].trim();
    }else{
      resEl.value = raw;
    }
  }catch(e){
    resEl.value = "请求失败，检查API Key或者网络";
  }
}

function copyPos(){
  navigator.clipboard.writeText(resEl.value);
  alert('正向提示词已复制');
}
function copyNeg(){
  navigator.clipboard.writeText(negResEl.value);
  alert('负面提示词已复制');
}

function getTpl(){
  return JSON.parse(localStorage.getItem(tplKey) || '[]');
}
function saveTpl(){
  const p = resEl.value.trim();
  const n = negResEl.value.trim();
  if(!p) return alert('先生成正向提示词！');
  const name = prompt('给这个模板起名字：');
  if(!name) return;
  const list = getTpl();
  list.push({name,pos:p,neg:n});
  localStorage.setItem(tplKey, JSON.stringify(list));
  renderTpl();
}
function renderTpl(){
  const wrap = document.getElementById('tplList');
  const list = getTpl();
  wrap.innerHTML = '';
  list.forEach(item=>{
    const div = document.createElement('div');
    div.className = 'tpl-item';
    div.innerText = item.name;
    div.onclick = ()=>{
      resEl.value = item.pos;
      negResEl.value = item.neg;
    }
    wrap.appendChild(div);
  })
}
function clearTpl(){
  localStorage.removeItem(tplKey);
  renderTpl();
}
renderTpl();
</script>
</body>
</html>
