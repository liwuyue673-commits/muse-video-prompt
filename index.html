<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt模板工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{padding:16px;background:#f4f4f4}
.box{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px}
textarea{width:100%;min-height:180px;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;resize:vertical}
input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;font-size:15px}
button{padding:10px 14px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;margin:4px;cursor:pointer}
button.del{background:#ef4444}
#list{margin-top:12px}
.item{padding:12px;border:1px solid #eee;border-radius:8px;margin:8px 0}
</style>
</head>
<body>
<div class="box">
<h3>Prompt编辑</h3>
<textarea id="prompt" placeholder="在这里写提示词..."></textarea>
<div style="margin-top:10px">
<button onclick="copy()">复制</button>
<button onclick="save()">保存模板</button>
<button onclick="document.getElementById('prompt').value=''">清空</button>
</div>
</div>
<div class="box">
<h3>我的模板</h3>
<input id="tname" placeholder="模板名称">
<div id="list"></div>
</div>
<script>
let data=JSON.parse(localStorage.getItem('pmList')||'[]')
function render(){
  let html=''
  data.forEach((it,i)=>{
    html+=`<div class="item"><b>${it.name}</b><p style="margin:6px 0;color:#444;font-size:14px">${it.text.slice(0,60)}...</p>
    <button onclick="load(${i})">载入</button><button class="del" onclick="del(${i})">删除</button></div>`
  })
  document.getElementById('list').innerHTML=html
}
function copy(){
  const t=document.getElementById('prompt').value
  navigator.clipboard.writeText(t).then(()=>alert('已复制'))
}
function save(){
  const name=document.getElementById('tname').value.trim()
  const text=document.getElementById('prompt').value.trim()
  if(!name||!text)return alert('名称和内容不能为空')
  data.push({name,text})
  localStorage.setItem('pmList',JSON.stringify(data))
  render()
  document.getElementById('tname').value=''
}
function load(i){
  document.getElementById('prompt').value=data[i].text
}
function del(i){
  data.splice(i,1)
  localStorage.setItem('pmList',JSON.stringify(data))
  render()
}
render()
</script>
</body>
</html>
